# One stack = one bot. Run exactly one `app` container per bot token.
#
# The server needs only this file and a .env next to it; the image comes from the registry.
# Defaults are sized for a small server shared with other apps. To build the image on the
# spot instead of pulling it, add compose.build.yml (see README).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # The whole data set is megabytes, so small buffers are enough.
    # On a server dedicated to the bot, raise these in .env.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=8MB
      -c max_connections=40
    mem_limit: ${PG_MEM_LIMIT:-512m}
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    image: ${IMAGE:-ghcr.io/mirzohid22/contest-bot:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Node's heap is capped at 512 MB in the image; the rest is headroom.
    mem_limit: ${APP_MEM_LIMIT:-768m}
    # Admin panel on the server's localhost only. Reach it through an SSH tunnel,
    # or put the server's own web server in front (see deploy/nginx-site.conf.example).
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3200}:3000"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  pgdata:
